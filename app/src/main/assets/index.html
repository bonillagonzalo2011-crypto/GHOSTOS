<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GHOSTOS</title>
<style>
:root{--bg:#1e1e1e;--card:#2a2a2a;--tx:#eee;--mut:#9a9a9a;--ac:#8a8a8a;--sz:78px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:200px 16px 32px}
.main{width:100%;padding:16px;border:0;border-radius:12px;background:#3a3a3a;color:#e8e8e8;font-size:16px;font-weight:700;letter-spacing:4px;cursor:pointer}

h2{font-size:13px;color:var(--mut);letter-spacing:1.5px;margin:26px 4px 10px;font-weight:600}
.rb{background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe94d,#3be86b,#2fc4ff,#7b5cff,#ff4de3,#ff3b3b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rb 4s linear infinite}
@keyframes rb{to{background-position:200% 0}}
.box{border:2px solid #555;border-radius:12px;padding:0 14px 10px}
.funcs{display:grid;grid-template-columns:1fr;gap:10px}
.f{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 4px;background:none;border:0;color:var(--tx);font-size:13px;font-weight:600;text-align:left;cursor:pointer}
.f::after{content:"";width:14px;height:14px;border:2px solid #777;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#1e1e1e}
.f.sel::after{content:"✓";background:none;border-color:#777;color:#3be86b;font-size:11px;line-height:1}
.f.lock{opacity:.35}
.p{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;color:var(--tx);text-align:left;cursor:pointer;background:none;padding:8px 4px;font-size:13px;font-weight:600}
.p i{font-style:normal;color:var(--mut);font-size:16px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.ov.show{display:flex}
.dlg{width:100%;max-width:360px;background:#2a2a2a;border:2px solid #555;border-radius:16px;padding:20px;text-align:center}
.dlg h3{margin:0 0 10px;font-size:18px;letter-spacing:1.5px}
.dlg p{margin:0 0 18px;font-size:14px;color:#ccc;line-height:1.4}
.dbtn{display:flex;gap:10px}
.dbtn button{flex:1;padding:12px;border:0;border-radius:10px;background:#3a3a3a;color:#e8e8e8;font-size:13px;font-weight:700;cursor:pointer}
.dbtn #dgo{background:#e8e8e8;color:#1e1e1e}

/* botones flotantes */
#fl{position:fixed;inset:0;pointer-events:none;z-index:5}
.fb{--off:#8a8a8a;--on:#3be86b;--al:.4;--bw:3px;--gl:12px;position:absolute;width:var(--sz);height:var(--sz);border-radius:50%;border:var(--bw) solid var(--off);background:rgba(0,0,0,var(--al));color:var(--off);font-size:calc(var(--sz)*.14);font-weight:700;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:border-color .2s,color .2s,box-shadow .2s;pointer-events:auto;touch-action:none;cursor:grab;white-space:nowrap;display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center}
.fb.g{border-color:var(--on);color:var(--on);box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 var(--gl) var(--gc,var(--on))}
.fb .ic{color:#fff;width:calc(var(--sz)*.34);height:calc(var(--sz)*.34);display:block}
.ic svg,.ich svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.igrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:320px;overflow-y:auto;padding:2px}
.ich{aspect-ratio:1;border:2px solid #555;border-radius:10px;background:none;color:var(--tx);padding:8px;cursor:pointer}
.ich.act{border-color:#e8e8e8;color:#fff}
.fb.nn .ic{width:calc(var(--sz)*.5);height:calc(var(--sz)*.5)}
.fb .ic.i2{display:none}.fb.g .ic.i1{display:none}.fb.g .ic.i2{display:block}
.fb[data-shape=square]{border-radius:8px}
.fb[data-shape=rounded]{border-radius:28%}
.fb[data-shape=leaf]{border-radius:50% 10px 50% 10px}
.fb[data-shape=leaf2]{border-radius:10px 50% 10px 50%}
.fb[data-shape=drop]{border-radius:50% 50% 50% 8px}
.fb[data-shape=oval]{width:calc(var(--sz)*1.3);height:calc(var(--sz)*.85);border-radius:50%}
.fb[data-shape=tall]{width:calc(var(--sz)*.7);height:calc(var(--sz)*1.3);border-radius:999px}
.fb[data-shape=blob]{border-radius:60% 40% 55% 45%/45% 55% 40% 60%}
.fb[data-shape=arch]{border-radius:50% 50% 12px 12px}
.fb[data-shape=wide]{width:calc(var(--sz)*1.8);height:calc(var(--sz)*.55);border-radius:12px}
.fb[data-shape=egg]{border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.fb[data-shape=pill]{width:calc(var(--sz)*1.45);height:calc(var(--sz)*.7);border-radius:999px}

.fb[data-ro]:not(.g),.fb[data-rn].g{border-color:transparent;background:linear-gradient(rgba(0,0,0,var(--al)),rgba(0,0,0,var(--al))) padding-box,linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe94d,#3be86b,#2fc4ff,#7b5cff,#ff4de3,#ff3b3b) border-box;background-size:100% 100%,200% 100%;animation:rb 4s linear infinite}

.fb[data-ro]:not(.g),.fb[data-rn].g{background:rgba(0,0,0,var(--al));animation:none}
.fb[data-ro]:not(.g)::before,.fb[data-rn].g::before{content:"";position:absolute;inset:calc(var(--bw)*-1);border-radius:inherit;padding:var(--bw);background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe94d,#3be86b,#2fc4ff,#7b5cff,#ff4de3,#ff3b3b);background-size:200% 100%;animation:rb 4s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* pantalla personalizar */
.back{background:none;border:0;color:var(--mut);font-size:13px;font-weight:700;letter-spacing:2px;padding:8px 4px;cursor:pointer;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin:8px 0 6px}
.tabs button{flex:1;padding:10px 4px;border:2px solid #555;border-radius:10px;background:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer}
.tabs button.act{border-color:#e8e8e8;color:#e8e8e8}
.prev{display:flex;justify-content:space-around;align-items:center;gap:10px;padding:14px 0 6px}
.prev div{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:110px;justify-content:center}
.prev small{color:var(--mut);font-size:11px;font-weight:700;letter-spacing:1.5px}
.pv{position:relative;cursor:pointer}
.sub{font-size:12px;color:var(--mut);letter-spacing:1.5px;font-weight:600;margin:16px 4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px}
.chip{padding:8px 12px;border:2px solid #555;border-radius:10px;background:none;color:var(--tx);font-size:12px;font-weight:600;cursor:pointer}
.chip.act{border-color:#e8e8e8}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #555;padding:0;cursor:pointer}
.sw.act{border-color:#fff;box-shadow:0 0 0 2px #1e1e1e inset}
.col{width:32px;height:32px;border:2px solid #555;border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#3a3a3a;color:#eee;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  </div>
</div>

<div id="fl"></div>
<div id="toast"></div>

  var rb=document.createElement('button');rb.className='sw'+(val==='rainbow'?' act':'');rb.title='Rainbow';rb.style.background='conic-gradient(#ff3b3b,#ffe94d,#3be86b,#2fc4ff,#7b5cff,#ff4de3,#ff3b3b)';rb.onclick=function(){cfg[curN][key]='rainbow';save();renderCs()};if(!norb)box.appendChild(rb);
  var i=document.createElement('input');i.type='color';i.className='col';i.value=val==='rainbow'?'#ffffff':val;
  if(!found&&val!=='rainbow')i.style.borderColor='#fff';
  i.oninput=function(){cfg[curN][key]=i.value;save();applyCfg(pvoff,curN);applyCfg(pvon,curN)};
  i.onchange=function(){renderCs()};
  box.appendChild(i);
}
function iconGrid(){
  var box=document.getElementById('icons'),st=box.scrollTop;box.innerHTML='';box.className='igrid';
  var n=document.createElement('button');n.className='ich'+(!IC[cfg[curN].icon]?' act':'');n.textContent='Ninguno';n.style.fontSize='11px';n.onclick=function(){cfg[curN].icon='';save();renderCs()};box.appendChild(n);
  IC.forEach(function(sv,i){var b=document.createElement('button');b.className='ich'+(cfg[curN].icon===String(i)?' act':'');b.innerHTML='<svg viewBox="0 0 24 24">'+sv+'</svg>';b.title='Diseño '+(i+1);b.onclick=function(){cfg[curN].icon=String(i);save();renderCs()};box.appendChild(b)});
  box.scrollTop=st;
}
function iconGridK(id,key){
 var box=document.getElementById(id),st=box.scrollTop,two=key==='icon2',cur=cfg[curN][key];box.innerHTML='';box.className='igrid';
 function add(label,val,act){var b=document.createElement('button');b.className='ich'+(act?' act':'');b.textContent=label;b.style.fontSize='11px';b.onclick=function(){cfg[curN][key]=val;save();renderCs()};box.appendChild(b)}
 if(two){add('Igual','',!cur);add('Ninguno','none',cur==='none')}else add('Ninguno','',!IC[cur]);
 IC.forEach(function(sv,i){var b=document.createElement('button');b.className='ich'+(cur===String(i)?' act':'');b.innerHTML='<svg viewBox="0 0 24 24">'+sv+'</svg>';b.onclick=function(){cfg[curN][key]=String(i);save();renderCs()};box.appendChild(b)});
 box.scrollTop=st;
}
var SS={};function renderCs(){SS.a=document.getElementById('son').scrollTop;SS.b=document.getElementById('sof').scrollTop;
  var t=document.getElementById('tabs');t.innerHTML='';
  NAMES.forEach(function(n){
    var b=document.createElement('button');b.textContent=n;b.className=n===curN?'act':'';
    b.onclick=function(){curN=n;renderCs()};t.appendChild(b);
  });
  applyCfg(pvoff,curN);applyCfg(pvon,curN);
  iconGridK('icons','icon');iconGridK('icons2','icon2');
  chips('shapes',SHAPES,'shape',false);
  chips('nms',[[true,'Mostrar'],[false,'Quitar']],'name',false);
  colors('coff','off');colors('con','on');
  slider('szs','size',60,120);slider('als','alpha',0,80);slider('bws','border',1,8);
  chips('gls',[[true,'Sí'],[false,'No']],'glow',false);
  colors('gcs','glowc',true);
  chips('son',SOUNDS,'sOn',true);
  chips('sof',SOUNDS,'sOff',true);
  [['son',SS.a],['sof',SS.b]].forEach(function(p){var e=document.getElementById(p[0]);e.style.maxHeight='220px';e.style.overflowY='auto';e.scrollTop=p[1]});
  var oc=curN==='VPN';['icons','icons2','nms','shapes','szs','als','bws','son','sof'].forEach(function(id){var c=document.getElementById(id);c.style.display=oc?'none':'';c.previousElementSibling.style.display=oc?'none':''});
  ['gls','gcs'].forEach(function(id){var c=document.getElementById(id),h=curN!=='VPN';c.style.display=h?'none':'';c.previousElementSibling.style.display=h?'none':''});
}
</script>
